<!DOCTYPE html>
<html lang="id" x-data="{ darkMode: localStorage.getItem('darkMode') === 'true' }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLY ADMIN</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS Terpisah -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="text-slate-800 dark:text-slate-100 min-h-screen smooth-transition"
      x-data="appData()">

    <!-- HEADER STICKY DI ATAS (Gradasi Biru ke Biru Gelap dengan Efek Glass) -->
<div class="sticky top-0 z-40 bg-gradient-to-r from-blue-600/90 via-blue-700/90 to-indigo-900/90 backdrop-blur-xl border-b border-white/20 shadow-lg smooth-transition">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-3 sm:py-4">
        <div class="flex flex-col gap-3">
            
            <!-- Baris 1: Judul & Tanggal -->
            <div class="flex justify-between items-center gap-3">
                <div>
                    <h1 class="text-xs font-bold tracking-tight text-white uppercase drop-shadow-sm">
                        DATA ACCURATE
                    </h1>
                    <p class="text-xs font-semibold text-blue-200 mt-0.5 uppercase tracking-wider" x-text="tanggalUpdate"></p>
                </div>
                <button id="logoutButton" type="button" class="px-3 py-2 rounded-full border border-white/30 bg-white/10 text-white text-xs font-bold hover:bg-white/20 smooth-transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
                </button>
            </div>

            <!-- Baris 2: Kotak Pencarian (Full Width) -->
            <div class="relative w-full">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-white/70">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" x-model.debounce.300ms="search" @input="currentPage = 1" placeholder="Pencarian Kode / Deskripsi..." 
                       class="w-full pl-9 pr-4 py-2.5 bg-white/25 dark:bg-black/25 border border-white/40 rounded-full text-xs font-medium focus:outline-none focus:ring-2 focus:ring-white text-white placeholder-white/85 smooth-transition shadow-inner">
            </div>

            <!-- Baris 3: Filter Stok & Tombol Dark Mode (Responsif & Proporsional) -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
                
                <!-- Filter Stok dengan Slider Kapsul Geser Smooth -->
                <div class="relative flex items-center bg-black/30 p-1 rounded-full border border-white/20 text-xs font-medium w-full sm:w-auto">
                    
                    <!-- Kapsul Putih Slider Bergeser -->
                    <div class="absolute ios-glass-card rounded-full h-[calc(100%-8px)] shadow-md slider-pill z-0"
                         :style="{
                            width: '33.33%', 
                            transform: statusFilter === 'semua' ? 'translateX(0%)' : (statusFilter === 'ready' ? 'translateX(100%)' : 'translateX(200%)')
                         }">
                    </div>

                    <button @click="statusFilter = 'semua'; currentPage = 1" 
                            :class="statusFilter === 'semua' ? 'text-blue-700 font-bold' : 'text-white hover:text-blue-200'"
                            class="relative z-10 w-28 py-1.5 text-center rounded-full smooth-transition active-jelly">Semua</button>
                    <button @click="statusFilter = 'ready'; currentPage = 1" 
                            :class="statusFilter === 'ready' ? 'text-blue-700 font-bold' : 'text-white hover:text-blue-200'"
                            class="relative z-10 w-28 py-1.5 text-center rounded-full smooth-transition active-jelly">Ready</button>
                    <button @click="statusFilter = 'kosong'; currentPage = 1" 
                            :class="statusFilter === 'kosong' ? 'text-blue-700 font-bold' : 'text-white hover:text-blue-200'"
                            class="relative z-10 w-28 py-1.5 text-center rounded-full smooth-transition active-jelly">Kosong</button>
                </div>

                <!-- Tombol Dark Mode -->
                <button @click="darkMode = !darkMode; localStorage.setItem('darkMode', darkMode)" 
                        class="px-4 py-2 rounded-full border border-white/30 bg-white/10 text-white text-xs font-bold uppercase tracking-wider hover:bg-white/20 smooth-transition flex items-center justify-center gap-2 shadow-sm active-jelly">
                    <i class="fa-solid" :class="darkMode ? 'fa-sun text-yellow-300' : 'fa-moon text-white'"></i>
                    <span x-text="darkMode ? 'Light Mode' : 'Dark Mode'"></span>
                </button>

            </div>

        </div>
    </div>
</div>

    <!-- MAIN CONTAINER -->
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8">
        
        <!-- Main Content Table Card dengan Efek Kaca iOS -->
        <div class="ios-glass-card rounded-3xl shadow-xl overflow-hidden smooth-transition">
            
            <div x-show="loading" class="flex justify-center items-center py-20">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
            </div>

            <div x-show="loadError" class="py-12 text-center text-rose-600 dark:text-rose-400" role="alert" x-text="loadError"></div>

            <!-- Table -->
            <div x-show="!loading && !loadError" class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-black/5 dark:bg-white/5 text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider border-b border-slate-200/50 dark:border-slate-700/50">
                            <th class="py-3.5 px-1 font-semibold w-12 text-center">No</th>
                            <th class="py-3.5 px-1 font-semibold w-48">Kode</th>
                            <th class="py-3.5 px-1 font-semibold text-center w-20">Qty</th>
                            <th class="py-3.5 px-1.5 font-semibold text-right w-32">Harga Jual</th>
                            <th class="py-3.5 px-4 font-semibold">Deskripsi Produk</th>
                            <th class="py-3.5 px-3 font-semibold text-right w-28">HPP</th>
                            <th class="py-3.5 px-3 font-semibold text-right w-28">Last</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200/40 dark:divide-slate-700/40 text-xs">
                        <template x-for="(item, index) in paginatedItems" :key="item.kode">
                            <tr @click="openModal(item)" 
                                class="hover:bg-amber-500/10 dark:hover:bg-amber-500/15 cursor-pointer smooth-transition active-jelly group">
                                <td class="py-1 px-3 text-slate-400 dark:text-slate-500 font-medium text-xs text-center" x-text="startIndex + index + 1"></td>
                                <td class="py-1 px-3 font-bold text-blue-600 dark:text-blue-400 whitespace-nowrap group-hover:underline" x-text="item.kode"></td>
                                <td class="py-1 px-3 text-center">
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold"
                                          :class="item.kuantitas > 0 ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/15 text-rose-600 dark:text-rose-400 border border-rose-500/20'"
                                          x-text="item.kuantitas"></span>
                                </td>
                                <td class="py-1 px-3 text-right font-semibold text-slate-700 dark:text-slate-200" x-text="item.harga_jual"></td>
                                <td class="py-1 px-4 text-slate-700 dark:text-slate-200 font-medium" x-text="item.deskripsi"></td>
                                <td class="py-1 px-3 text-right text-xs font-medium text-slate-500 dark:text-slate-400" x-text="item.hpp"></td>
                                <td class="py-1 px-3 text-right text-xs font-medium text-slate-500 dark:text-slate-400" x-text="item.last"></td>
                            </tr>
                        </template>
                        <template x-if="filteredItems.length === 0">
                            <tr>
                                <td colspan="7" class="py-12 text-center text-slate-400 dark:text-slate-500">
                                    <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
                                    <p>Tidak ada data yang cocok dengan pencarian Anda.</p>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Pagination Bar -->
            <div class="px-6 py-4 bg-black/5 dark:bg-white/5 border-t border-slate-200/50 dark:border-slate-700/50 flex flex-col sm:flex-row items-center justify-between gap-4 smooth-transition" x-show="!loading && !loadError && filteredItems.length > 0">
                <div class="flex items-center gap-3 text-xs text-slate-500 dark:text-slate-400">
                    <span>Menampilkan <span class="font-semibold text-slate-700 dark:text-slate-200" x-text="startIndex + 1"></span> - <span class="font-semibold text-slate-700 dark:text-slate-200" x-text="Math.min(startIndex + rowsPerPage, filteredItems.length)"></span> dari <span class="font-semibold text-slate-700 dark:text-slate-200" x-text="filteredItems.length"></span></span>
                    
                    <div class="flex items-center gap-1.5 ml-2">
                        <span>Tampilkan:</span>
                        <select x-model.number="rowsPerPage" @change="currentPage = 1" 
                                class="bg-white/60 dark:bg-slate-800/60 text-slate-800 dark:text-white px-2 py-1 rounded-lg border border-slate-300/50 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs font-medium">
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>

                <!-- Tombol Navigasi -->
                <div class="flex items-center gap-2">
                    <button @click="prevPage()" :disabled="currentPage === 1" 
                            class="px-3.5 py-1.5 text-xs font-medium rounded-xl border border-slate-300/50 dark:border-slate-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-white/50 dark:hover:bg-slate-700/50 smooth-transition active-jelly">
                        <i class="fa-solid fa-chevron-left mr-1"></i> Prev
                    </button>
                    <span class="text-xs font-semibold px-3 py-1 bg-blue-500/15 text-blue-600 dark:text-blue-400 rounded-xl border border-blue-500/20" x-text="currentPage + ' / ' + totalPages"></span>
                    <button @click="nextPage()" :disabled="currentPage >= totalPages" 
                            class="px-3.5 py-1.5 text-xs font-medium rounded-xl border border-slate-300/50 dark:border-slate-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-white/50 dark:hover:bg-slate-700/50 smooth-transition active-jelly">
                        Next <i class="fa-solid fa-chevron-right ml-1"></i>
                    </button>
                </div>
            </div>

        </div>

        <!-- POPUP / MODAL DETAIL ITEM (Dengan Animasi Jelly Kenyal) -->
        <div x-show="modalOpen" 
             style="display: none;"
             class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-md"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0">
            
            <div @click.outside="modalOpen = false" 
                 class="ios-glass-card rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-jelly">
                
                <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200/40 dark:border-slate-700/40">
                    <h3 class="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fa-solid fa-circle-info text-blue-600 dark:text-blue-400"></i> Detail Informasi Produk
                    </h3>
                    <button @click="modalOpen = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 smooth-transition active-jelly">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                    <div class="grid grid-cols-2 gap-4 pb-4 border-b border-slate-200/40 dark:border-slate-700/40">
                        <div>
                            <span class="text-xs text-slate-400 block mb-1">Kode Produk</span>
                            <span class="font-bold text-blue-600 dark:text-blue-400 text-base" x-text="selectedItem.kode"></span>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 block mb-1">Kuantitas Stok</span>
                            <span class="font-bold text-emerald-600 dark:text-emerald-400 text-base" x-text="selectedItem.kuantitas"></span>
                        </div>
                    </div>

                    <div>
                        <span class="text-xs text-slate-400 block mb-1">Harga Jual</span>
                        <p class="text-lg font-bold text-emerald-600 dark:text-emerald-400" x-text="selectedItem.harga_jual"></p>
                    </div>

                    <div>
                        <span class="text-xs text-slate-400 block mb-1">Deskripsi Produk</span>
                        <p class="text-sm font-medium text-slate-700 dark:text-slate-300 bg-white/50 dark:bg-black/30 p-3.5 rounded-2xl border border-slate-200/30 dark:border-slate-700/30" x-text="selectedItem.deskripsi"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-2">
                        <div>
                            <span class="text-xs text-slate-400 block mb-1">HPP (Kolom H)</span>
                            <span class="font-semibold text-slate-700 dark:text-slate-200" x-text="selectedItem.hpp"></span>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 block mb-1">Last Cost (Kolom J)</span>
                            <span class="font-semibold text-slate-700 dark:text-slate-200" x-text="selectedItem.last"></span>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-4 bg-black/5 dark:bg-white/5 border-t border-slate-200/40 dark:border-slate-700/40 flex justify-end">
                    <button @click="modalOpen = false" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold uppercase tracking-wider smooth-transition shadow-lg shadow-blue-500/25 active-jelly">
                        Tutup
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Custom JS Terpisah -->
    <script src="assets/js/app.js"></script>
</body>
</html>
